version: 2

updates:
  # The library itself has no runtime dependencies. The two surfaces worth
  # watching are the documentation toolchain and the GitHub Actions used by the
  # workflows.

  # Documentation dependencies (Sphinx + MyST, pinned in docs/requirements.txt)
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "Update"
    groups:
      # Sphinx and its plugins move together: a single pull request avoids
      # proposing a version of one that no longer matches the others
      documentation:
        patterns:
          - "*"

  # Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "Update"
    groups:
      github-actions:
        patterns:
          - "*"
