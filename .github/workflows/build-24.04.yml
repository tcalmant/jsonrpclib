# This workflow lints the code and runs the tests on a range of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI Build

on:
  push:
    branches: [ "main" ]
    tags:
      - '**'
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install the linters
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff black
    - name: Lint with ruff
      # A Python 2.7-safe rule set (the pyupgrade rewrites are excluded);
      # configured in pyproject.toml
      run: ruff check .
    - name: Check the formatting with black
      run: black --check .
    - name: Check the declared version
      # The version is repeated in pyproject.toml and in every module, both as a
      # __version_info__ tuple and as a ':version:' docstring field: catch a
      # half-applied bump here rather than when publishing.
      run: python .github/scripts/check_version.py

  build:
    needs: lint
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
    - name: Test
      run: |
        ./run_tests.sh
    - name: Coveralls
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
      run: |
        pip install coveralls
        coveralls
